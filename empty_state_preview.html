<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .glass-pill {
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    /* defaults for the first set — every other set overrides these */
    .tab-btn svg {
      width: 34px;
      height: 34px;
      filter: none;
    }
    #preview-container svg {
      width: 140px;
      height: 140px;
      filter: none;
    }
    body:not(.clay-set):not(.line-set):not(.clay3d-set):not(.neue-set):not(.linepro-set):not(.allblue-set):not(.linecolor-set) #preview-container .absolute { display: none; }
    .set-tab.active { background: #2563eb; color: #fff; }
    .clay-set .tab-btn svg,
    .clay-set #preview-container svg {
      filter: none;
    }
    .clay-set #preview-container svg {
      width: 156px;
      height: 156px;
    }
    .clay-set #preview-container .absolute { display: none; }
    .line-set .tab-btn svg {
      width: 40px;
      height: 40px;
      filter: drop-shadow(0 1px 2px rgba(30, 58, 95, 0.12));
    }
    .line-set #preview-container svg {
      width: 180px !important;
      height: 180px !important;
      filter: drop-shadow(0 6px 18px rgba(30, 58, 95, 0.09));
    }
    .clay3d-set .tab-btn svg {
      width: 36px;
      height: 36px;
      filter: none;
    }
    .clay3d-set #preview-container svg {
      width: 140px !important;
      height: 140px !important;
      filter: none;
    }
    .clay3d-set #preview-container .absolute { display: none; }
    .clay-blue-shade #preview-container .absolute {
      display: block;
      inset: -24px;
      background: radial-gradient(ellipse at 58% 58%, rgba(59, 130, 246, .21) 0%, rgba(96, 165, 250, .12) 38%, rgba(219, 234, 254, .04) 62%, transparent 75%);
      filter: blur(16px);
      pointer-events: none;
    }
    .clay-blue-shade #preview-container svg {
      position: relative;
      filter: drop-shadow(0 8px 12px rgba(37, 99, 235, .10));
    }
    /* Fifth set: pure neumorphism, sitting on the plain white page */
    .neue-set .tab-btn {
      background: transparent !important;
      box-shadow: none;
    }
    .neue-set .tab-btn[aria-selected="true"] {
      background: #ffffff !important;
      border-radius: 16px;
      box-shadow: 3px 4px 9px rgba(138, 158, 190, 0.4), -3px -3px 8px rgba(255, 255, 255, 0.95);
    }
    .neue-set .tab-btn svg {
      width: 34px;
      height: 34px;
      filter: none;
    }
    .neue-set #preview-container svg {
      width: 150px !important;
      height: 150px !important;
      filter: none;
    }
    .neue-set #preview-container .absolute { display: none; }
    .linepro-set .tab-btn svg {
      width: 40px;
      height: 40px;
      filter: drop-shadow(0 1px 2px rgba(65, 90, 119, 0.10));
    }
    .linepro-set #preview-container svg {
      width: 185px !important;
      height: 185px !important;
      filter: drop-shadow(0 12px 24px rgba(65, 90, 119, 0.08));
    }
    .linepro-set #preview-container .absolute {
      opacity: 0.3;
    }
    .allblue-set .tab-btn svg {
      width: 30px;
      height: 30px;
      filter: none;
    }
    .allblue-set #preview-container svg {
      width: 132px !important;
      height: 132px !important;
      filter: none;
    }
    .allblue-set #preview-container .absolute { display: none; }
    .linecolor-set .tab-btn svg {
      width: 40px;
      height: 40px;
      filter: drop-shadow(0 1px 3px rgba(51, 65, 85, 0.12));
    }
    .linecolor-set #preview-container svg {
      width: 185px !important;
      height: 185px !important;
      filter: drop-shadow(0 12px 24px rgba(51, 65, 85, 0.08));
    }
    .linecolor-set #preview-container .absolute {
      opacity: 0.2;
    }
    .pop-set .tab-btn svg { width: 40px; height: 40px; filter: none; }
    .pop-set #preview-container svg { width: 168px; height: 168px; filter: none; }
    .pop-set #preview-container .absolute { display: none; }
    .set-tab {
      flex-shrink: 0;
      white-space: nowrap;
      font-size: 10px !important;
      line-height: 1rem !important;
      padding: 6px 8px !important;
    }
  </style>
</head>
<body class="bg-white text-slate-900 p-4 sm:p-6 antialiased font-sans min-h-screen">
  <div class="max-w-6xl mx-auto flex min-h-[calc(100vh-3rem)] flex-col gap-4">
    <div class="flex flex-nowrap gap-0.5 overflow-x-auto pb-1">
      <button id="set-blue" class="set-tab active rounded-md px-3 py-2 text-xs font-semibold" onclick="selectIconSet('blue')">First set</button>
      <button id="set-clay" class="set-tab rounded-md px-3 py-2 text-xs font-semibold text-slate-500" onclick="selectIconSet('clay')">Second set</button>
      <button id="set-line" class="set-tab rounded-md px-3 py-2 text-xs font-semibold text-slate-500" onclick="selectIconSet('line')">Third set</button>
      <button id="set-clay3d" class="set-tab rounded-md px-3 py-2 text-xs font-semibold text-slate-500" onclick="selectIconSet('clay3d')">Fourth set (3D Clay)</button>
      <button id="set-claycolor" class="set-tab rounded-md px-3 py-2 text-xs font-semibold text-slate-500" onclick="selectIconSet('claycolor')">Clay Color</button>
      <button id="set-neue" class="set-tab rounded-md px-3 py-2 text-xs font-semibold text-slate-500" onclick="selectIconSet('neue')">Fifth set (Neumorphic)</button>
      <button id="set-linepro" class="set-tab rounded-md px-3 py-2 text-xs font-semibold text-slate-500" onclick="selectIconSet('linepro')">Sixth set (Line Pro)</button>
      <button id="set-allblue" class="set-tab rounded-md px-3 py-2 text-xs font-semibold text-slate-500" onclick="selectIconSet('allblue')">Seventh set (Duotone)</button>
      <button id="set-linecolor" class="set-tab rounded-md px-3 py-2 text-xs font-semibold text-slate-500" onclick="selectIconSet('linecolor')">Eighth set (Cool Line Pro)</button>
      <button id="set-pop" class="set-tab rounded-md px-3 py-2 text-xs font-semibold text-slate-500" onclick="selectIconSet('pop')">Confetti Pop</button>
    </div>
    <div class="flex gap-1.5 overflow-x-auto pb-1" id="tabs" role="tablist" aria-label="Workspace sections"></div>

    <!-- Live Preview Stage -->
    <div id="stage" class="bg-white p-8 sm:p-12 flex flex-1 flex-col items-center justify-center min-h-[480px] text-center relative overflow-hidden">
      <div id="preview-container" class="flex flex-col items-center">
        <!-- Injected via script -->
      </div>
    </div>

  </div>

  <script>
    /* ---------- First set: flat illustrations — filled shapes, one blue scale,
       no strokes-as-outlines, no rotation. ---------- */
    const C1 = { deep: '#1d4ed8', main: '#2563eb', mid: '#60a5fa', light: '#bfdbfe', pale: '#dbeafe' };

    const FIRST_BODIES = {
      drawing: `
        <rect x="24" y="22" width="58" height="78" rx="10" fill="${C1.main}"/>

        <rect x="88" y="34" width="16" height="66" rx="8" fill="${C1.mid}"/>

      model: `

        <path d="M28 41 L64 62 L64 100 L28 79 Z" fill="${C1.main}"/>
        <path d="M100 41 L100 79 L64 100 L64 62 Z" fill="${C1.deep}"/>`,
      structure: `

      shared: `
        <path d="M38 36 C50 18 78 18 90 36" fill="none" stroke="${C1.light}" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 8"/>
        <path d="M50 18 L82 27 L54 38 L57 28 Z" fill="${C1.main}"/>

        <rect x="70" y="44" width="44" height="58" rx="11" fill="${C1.light}"/>
        <rect x="80" y="58" width="24" height="5" rx="2.5" fill="#ffffff"/>
        <rect x="80" y="70" width="18" height="5" rx="2.5" fill="${C1.mid}"/>
        <rect x="80" y="82" width="24" height="5" rx="2.5" fill="${C1.mid}"/>`,
      survey: `
        <rect x="16" y="28" width="96" height="70" rx="14" fill="${C1.light}"/>
        <path d="M26 84 C36 62 56 52 76 56 C88 58 97 64 104 72" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
        <path d="M34 92 C42 74 58 66 74 70 C84 72 92 76 100 84" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
        <circle cx="62" cy="54" r="13" fill="${C1.main}"/>

        <path d="M62 28 v8 M62 72 v8 M36 54 h8 M80 54 h8" stroke="${C1.mid}" stroke-width="4.5" stroke-linecap="round"/>`,
      "site-capture": `
        <rect x="20" y="28" width="54" height="42" rx="9" fill="${C1.light}"/>
        <path d="M28 62 L42 46 L51 56 L60 44 L70 62 Z" fill="#ffffff"/>
        <path d="M52 58 l5 -9 h14 l5 9 Z" fill="${C1.main}"/>
        <rect x="28" y="56" width="78" height="46" rx="13" fill="${C1.main}"/>
        <circle cx="67" cy="79" r="15" fill="#ffffff"/>
        <circle cx="67" cy="79" r="8" fill="${C1.mid}"/>
        <circle cx="95" cy="68" r="4" fill="${C1.light}"/>`,
      submission: `
        <rect x="38" y="16" width="46" height="44" rx="8" fill="#ffffff" stroke="${C1.light}" stroke-width="3.5"/>
        <rect x="48" y="30" width="26" height="5" rx="2.5" fill="${C1.mid}"/>
        <rect x="48" y="42" width="18" height="5" rx="2.5" fill="${C1.light}"/>
        <path d="M24 54 h80 a8 8 0 0 1 8 8 v32 a8 8 0 0 1 -8 8 H24 a8 8 0 0 1 -8 -8 V62 a8 8 0 0 1 8 -8 Z" fill="${C1.main}"/>
        <path d="M17 60 L64 90 L111 60" fill="none" stroke="${C1.mid}" stroke-width="4.5" stroke-linejoin="round"/>
        <circle cx="98" cy="42" r="14" fill="${C1.mid}"/>
        <path d="M92 42 l4.5 4.5 L105 37" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`,
      bimbox: `
        <path d="M64 16 L82 26 L64 36 L46 26 Z" fill="${C1.mid}"/>
        <path d="M46 26 L64 36 L64 52 L46 42 Z" fill="${C1.main}"/>
        <path d="M82 26 L82 42 L64 52 L64 36 Z" fill="${C1.deep}"/>
        <path d="M28 74 L16 66 L46 54 L64 60 Z" fill="${C1.light}"/>
        <path d="M100 74 L112 66 L82 54 L64 60 Z" fill="${C1.light}"/>
        <path d="M28 74 L64 88 L64 110 L28 96 Z" fill="${C1.main}"/>
        <path d="M100 74 L100 96 L64 110 L64 88 Z" fill="${C1.deep}"/>
        <path d="M64 60 L100 74 L64 88 L28 74 Z" fill="${C1.mid}"/>`,
      files: `
        <path d="M16 42 h30 l8 10 h48 a10 10 0 0 1 10 10 v6 H16 Z" fill="${C1.mid}"/>
        <rect x="36" y="34" width="46" height="42" rx="7" fill="#ffffff" stroke="${C1.light}" stroke-width="3.5"/>
        <rect x="46" y="48" width="26" height="5" rx="2.5" fill="${C1.light}"/>
        <path d="M16 62 h96 v34 a10 10 0 0 1 -10 10 H26 a10 10 0 0 1 -10 -10 Z" fill="${C1.main}"/>
        <rect x="52" y="78" width="24" height="5" rx="2.5" fill="${C1.mid}"/>`,
      search: `
        <rect x="16" y="20" width="60" height="80" rx="12" fill="${C1.light}"/>
        <rect x="28" y="36" width="34" height="5.5" rx="2.75" fill="#ffffff"/>
        <rect x="28" y="50" width="26" height="5.5" rx="2.75" fill="#ffffff"/>
        <rect x="28" y="78" width="20" height="5.5" rx="2.75" fill="#ffffff"/>
        <path d="M90 84 L106 100" stroke="${C1.deep}" stroke-width="11" stroke-linecap="round"/>
        <circle cx="74" cy="66" r="25" fill="#ffffff"/>
        <circle cx="74" cy="66" r="25" fill="none" stroke="${C1.main}" stroke-width="7"/>`,
      issue: `
        <rect x="18" y="50" width="92" height="54" rx="13" fill="${C1.light}"/>
        <rect x="28" y="84" width="30" height="5.5" rx="2.75" fill="#ffffff"/>
        <rect x="68" y="84" width="34" height="5.5" rx="2.75" fill="#ffffff"/>
        <rect x="28" y="64" width="18" height="5.5" rx="2.75" fill="#ffffff"/>
        <path d="M64 14 a21 21 0 0 1 21 21 c0 14.5 -21 35 -21 35 s-21 -20.5 -21 -35 a21 21 0 0 1 21 -21 Z" fill="${C1.main}"/>
        <rect x="60" y="25" width="8" height="17" rx="4" fill="#ffffff"/>
        <circle cx="64" cy="50" r="4.6" fill="#ffffff"/>`,
      rfi: `
        <path d="M16 30 a13 13 0 0 1 13 -13 h48 a13 13 0 0 1 13 13 v28 a13 13 0 0 1 -13 13 H45 L29 85 V71 h-0 a13 13 0 0 1 -13 -13 Z" fill="${C1.main}"/>
        <path d="M44 38 a10 10 0 1 1 10 12 v3" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
        <circle cx="54" cy="61" r="4.6" fill="#ffffff"/>
        <rect x="66" y="76" width="46" height="28" rx="13" fill="${C1.light}"/>
        <circle cx="78" cy="90" r="3.6" fill="${C1.mid}"/>
        <circle cx="89" cy="90" r="3.6" fill="${C1.mid}"/>
        <circle cx="100" cy="90" r="3.6" fill="${C1.mid}"/>`,
      "field-note": `
        <rect x="22" y="24" width="64" height="82" rx="13" fill="${C1.main}"/>
        <rect x="42" y="16" width="24" height="16" rx="7" fill="${C1.mid}"/>
        <rect x="34" y="52" width="40" height="5.5" rx="2.75" fill="#ffffff"/>
        <rect x="34" y="66" width="40" height="5.5" rx="2.75" fill="${C1.light}"/>
        <rect x="34" y="80" width="24" height="5.5" rx="2.75" fill="${C1.light}"/>
        <g transform="rotate(32 98 64)">
          <rect x="90" y="30" width="16" height="50" rx="6" fill="${C1.mid}"/>
          <path d="M90 80 h16 l-8 14 Z" fill="${C1.deep}"/>
        </g>`,
      task: `
        <rect x="14" y="22" width="78" height="82" rx="14" fill="#ffffff" stroke="${C1.light}" stroke-width="3.5"/>
        <rect x="26" y="38" width="13" height="13" rx="4.5" fill="${C1.main}"/>
        <rect x="48" y="42" width="32" height="5.5" rx="2.75" fill="${C1.light}"/>
        <rect x="26" y="60" width="13" height="13" rx="4.5" fill="${C1.mid}"/>
        <rect x="48" y="64" width="32" height="5.5" rx="2.75" fill="${C1.light}"/>
        <rect x="26" y="82" width="13" height="13" rx="4.5" fill="${C1.light}"/>
        <rect x="48" y="86" width="22" height="5.5" rx="2.75" fill="${C1.light}"/>
        <circle cx="98" cy="86" r="20" fill="${C1.main}"/>
        <path d="M89 86 l6 6 L108 79" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>`,
      planner: `
        <rect x="16" y="26" width="96" height="80" rx="14" fill="#ffffff" stroke="${C1.light}" stroke-width="3.5"/>
        <path d="M16 40 a14 14 0 0 1 14 -14 h68 a14 14 0 0 1 14 14 v8 H16 Z" fill="${C1.main}"/>
        <rect x="38" y="14" width="10" height="20" rx="5" fill="${C1.mid}"/>
        <rect x="80" y="14" width="10" height="20" rx="5" fill="${C1.mid}"/>
        <rect x="28" y="62" width="40" height="11" rx="5.5" fill="${C1.main}"/>
        <rect x="44" y="80" width="46" height="11" rx="5.5" fill="${C1.mid}"/>
        <circle cx="96" cy="67.5" r="6" fill="${C1.light}"/>`
    };

    const SECTION_TEXT = {
      drawing: { title: "No drawings added yet", subtitle: "Upload architectural plans, blueprints, or CAD sheets to get started." },
      model: { title: "No 3D models added yet", subtitle: "Import IFC, Revit, or OBJ geometry files to inspect them in 3D." },
      structure: { title: "No project structure added yet", subtitle: "Create discipline folders or upload directory structures to organize your project." },
      shared: { title: "No shared files yet", subtitle: "Files and folders shared with your team or external partners will appear here." },
      survey: { title: "No survey data added yet", subtitle: "Upload point clouds, topography maps, or surveyor coordinates." },
      "site-capture": { title: "No site captures added yet", subtitle: "Upload site photos, 360° panoramas, and drone flight captures." },
      submission: { title: "No submissions added yet", subtitle: "Track formal submittal packages, drawings for approval, and deliverables." },
      bimbox: { title: "No BIMBOX assets yet", subtitle: "Official BIMBOX project deliverables and libraries will show up here." },
      files: { title: "No files added yet", subtitle: "Drag and drop documents or click upload to populate this folder." },
      search: { title: "No results found", subtitle: "Check for typos or try searching with different keywords." },
      issue: { title: "No issues reported yet", subtitle: "Quality, safety, and punchlist issues will appear here when flagged." },
      rfi: { title: "No RFIs submitted yet", subtitle: "Formal technical inquiries and requests for information will appear here." },
      "field-note": { title: "No field notes recorded yet", subtitle: "Capture site observations, walkdown notes, and field photos here." },
      task: { title: "No tasks created yet", subtitle: "Assign work packages, track progress, and organize execution tasks here." },
      planner: { title: "No schedule planned yet", subtitle: "Build your project timeline, track critical paths, and schedule milestones." }
    };

    const SECTIONS = Object.fromEntries(Object.entries(SECTION_TEXT).map(([key, text]) => [key, {
      title: text.title,
      subtitle: text.subtitle,
      svg: `<svg viewBox="0 0 128 128" class="w-24 h-24" fill="none">${FIRST_BODIES[key]}</svg>`
    }]));

    const CLAY_SYMBOLS = {
      drawing: `<path d="M43 43h28l10 10v32H43z"/><path d="M71 43v11h10M50 65h24M50 73h18"/>`,
      model: `<path d="M64 41l22 12-22 12-22-12zM42 53v24l22 12 22-12V53M64 65v24"/>`,
      structure: `<circle cx="64" cy="43" r="6"/><circle cx="45" cy="80" r="6"/><circle cx="83" cy="80" r="6"/><path d="M64 49v13M45 74v-8h38v8"/>`,
      shared: `<circle cx="46" cy="64" r="7"/><circle cx="81" cy="47" r="7"/><circle cx="81" cy="81" r="7"/><path d="M52 60l23-11M52 68l23 11"/>`,
      issue: `<circle cx="64" cy="64" r="25"/><path d="M64 49v18M64 77h.1"/>`,
      rfi: `<path d="M46 40h36a7 7 0 0 1 7 7v21a7 7 0 0 1-7 7H65l-13 10V75h-6a7 7 0 0 1-7-7V47a7 7 0 0 1 7-7z"/><path d="M58 52c1-8 14-7 14 1 0 6-7 6-7 11M65 70h.1"/>`,
      'field-note': `<rect x="43" y="39" width="42" height="50" rx="7"/><path d="M53 54h22M53 64h22M53 74h15"/>`,
      task: `<rect x="42" y="41" width="44" height="46" rx="10"/><path d="M53 62l7 7 15-17M53 78h23"/>`,
      planner: `<rect x="40" y="43" width="48" height="43" rx="8"/><path d="M40 56h48M51 39v9M77 39v9M51 67h8M68 67h8M51 77h8"/>`,
      survey: `<circle cx="64" cy="62" r="22"/><circle cx="64" cy="62" r="7"/><path d="M64 33v10M64 81v10M35 62h10M83 62h10"/>`,
      'site-capture': `<rect x="38" y="48" width="52" height="34" rx="9"/><path d="M50 48l5-8h18l5 8"/><circle cx="64" cy="65" r="11"/>`,
      submission: `<rect x="40" y="45" width="48" height="34" rx="8"/><path d="M41 49l23 17 23-17M64 35v18M56 43l8-8 8 8"/>`,
      bimbox: `<path d="M64 36l25 13-25 13-25-13z"/><path d="M39 62l25 13 25-13"/><path d="M39 75l25 13 25-13"/>`,
      files: `<path d="M38 49h20l6 7h26v31H38z"/><path d="M45 62h38"/>`,
      search: `<circle cx="59" cy="58" r="20"/><path d="M74 73l16 16"/>`
    };

    /* Second set: one solid clay tile — vivid blue body, top sheen, white glyph on it */
    function claySvg(key) {
      const id = `clay-${key}`;
      return `<svg viewBox="0 0 128 128" class="w-24 h-24" fill="none">
        <defs>
          <linearGradient id="${id}-body" x1="0.15" y1="0" x2="0.85" y2="1">
            <stop offset="0%" stop-color="#7fb4ff"/>
            <stop offset="45%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#1b48bd"/>
          </linearGradient>
          <linearGradient id="${id}-sheen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="${id}-floor" cx="50%" cy="50%" r="50%">

      <path d="M86 26 h9 v38 h-9 z" fill="#ede9fe" stroke="#8b5cf6" stroke-width="0.82"/>
      <path d="M86 64 h9 l-4.5 8 z" fill="#3b82f6" stroke="#8b5cf6" stroke-width="0.75"/>
      <line x1="86" y1="36" x2="95" y2="36" stroke="#8b5cf6" stroke-width="0.9"/>
    </g>`,
      'task': `
    <rect x="28" y="34" width="52" height="58" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="0.9"/>
    <rect x="44" y="29" width="20" height="8.5" rx="3.5" fill="#ffffff" stroke="#2563eb" stroke-width="0.82"/>
    <rect x="37" y="47" width="10" height="10" rx="2.5" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.82"/>
    <path d="M39.5 52 L41.8 54.4 L45 50.4" fill="none" stroke="#2563eb" stroke-width="1.0"/>
    <line x1="53" y1="52" x2="71" y2="52" stroke="#2563eb" stroke-width="0.82"/>
    <rect x="37" y="63" width="10" height="10" rx="2.5" fill="#ede9fe" stroke="#8b5cf6" stroke-width="0.78"/>
    <line x1="53" y1="68" x2="69" y2="68" stroke="#8b5cf6" stroke-width="0.82"/>
    <rect x="37" y="79" width="10" height="10" rx="2.5" fill="#ecfeff" stroke="#0891b2" stroke-width="0.78"/>
    <line x1="53" y1="84" x2="65" y2="84" stroke="#0891b2" stroke-width="0.82"/>
    <g transform="translate(91 70)">
      <circle r="14" fill="#ffffff" stroke="#e0f2fe" stroke-width="2.2"/>
      <circle r="14" fill="none" stroke="#8b5cf6" stroke-width="2.2" stroke-dasharray="53 88" stroke-linecap="round" transform="rotate(-90)"/>
      <path d="M-4.5 0 L-1.5 3.2 L5 -3.6" fill="none" stroke="#0891b2" stroke-width="1.2"/>
    </g>`,
      'planner': `
    <rect x="26" y="32" width="76" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="0.9"/>
    <line x1="26" y1="46" x2="102" y2="46" stroke="#2563eb" stroke-width="0.82"/>
    <path d="M44 27 v8 M64 27 v8 M84 27 v8" stroke="#2563eb" stroke-width="1.0"/>
    <line x1="34" y1="39" x2="48" y2="39" stroke="#93c5fd" stroke-width="0.82"/>
    <rect x="34" y="54" width="30" height="6.5" rx="3.25" fill="#2563eb"/>
    <rect x="48" y="66" width="32" height="6.5" rx="3.25" fill="#0ea5e9"/>
    <rect x="62" y="78" width="24" height="6.5" rx="3.25" fill="#8b5cf6"/>
    <path d="M64 60.5 v5.5 M80 72.5 v5.5" stroke="#93c5fd" stroke-width="0.7" stroke-dasharray="1.6 2.2"/>
    <rect x="86" y="53" width="9" height="9" rx="1.8" transform="rotate(45 90.5 57.5)" fill="#06b6d4" stroke="#ffffff" stroke-width="1.0"/>
    <circle cx="90.5" cy="57.5" r="1.6" fill="#ffffff"/>`,
    };

    function lineColorSvg(key) {
      return `<svg viewBox="0 0 128 128" class="w-24 h-24" fill="none">
        <defs>
          <radialGradient id="lc-${key}-halo" cx="50%" cy="46%" r="54%">
            <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.55"/>
            <stop offset="50%" stop-color="#ede9fe" stop-opacity="0.30"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="lc-${key}-shadow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#475569" stop-opacity="0.12"/>
            <stop offset="100%" stop-color="#475569" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle cx="64" cy="58" r="44" fill="url(#lc-${key}-halo)"/>
        <ellipse cx="64" cy="99" rx="33" ry="6" fill="url(#lc-${key}-shadow)"/>
        <line x1="22" y1="99" x2="106" y2="99" stroke="#cbd5e1" stroke-width="0.75" stroke-linecap="round" stroke-dasharray="1.5 5"/>
        <g stroke-linecap="round" stroke-linejoin="round">${LINECOLOR_BODIES[key]}</g>
      </svg>`;
    }

    const LINECOLOR_SECTIONS = Object.fromEntries(Object.entries(SECTIONS).map(([key, item]) => [key, {
      title: item.title,
      subtitle: item.subtitle,
      svg: lineColorSvg(key)
    }]));

    const POP_BODIES = {
      drawing: '<rect x="40" y="39" width="42" height="38" rx="4" fill="#e0f2fe"/><path d="M47 69V47h17v10h11v12z" stroke="#3b82f6" stroke-width="2"/><path d="M45 84h26" stroke="#cbdfee" stroke-width="3"/>',
      model: '<path d="M61 32l23 13-23 14-23-14z" fill="#7dd3fc"/><path d="M38 45l23 14v27L38 73z" fill="#3b82f6"/><path d="M61 59l23-14v28L61 86z" fill="#1d4ed8"/><path d="M61 32v9" stroke="#fff" stroke-width="2"/>',
      structure: '<path d="M61 50v13M43 76V63h36v13" stroke="#99c9ec" stroke-width="3"/><rect x="50" y="35" width="22" height="17" rx="4" fill="#2563eb"/><rect x="33" y="73" width="20" height="15" rx="4" fill="#38bdf8"/><rect x="69" y="73" width="20" height="15" rx="4" fill="#fbbf24"/>',
      shared: '<circle cx="44" cy="62" r="9" fill="#38bdf8"/><circle cx="78" cy="42" r="9" fill="#14b8a6"/><circle cx="78" cy="81" r="9" fill="#fb923c"/><path d="M52 58l18-11M52 67l18 10" stroke="#99c9ec" stroke-width="3"/>',
      issue: '<path d="M61 34l27 45H34z" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/><path d="M61 49v13" stroke="#fff" stroke-width="5"/><circle cx="61" cy="71" r="2.6" fill="#fff"/>',
      rfi: '<path d="M39 37h45v34H59L46 82V71h-7z" fill="#2563eb"/><path d="M54 49c0-9 17-9 17 0 0 5-9 5-9 11" stroke="#fff" stroke-width="3"/><circle cx="62" cy="65" r="1.8" fill="#fff"/>',
      'field-note': '<rect x="40" y="32" width="40" height="53" rx="5" fill="#fbbf24"/><path d="M48 45h23M48 54h23M48 63h16" stroke="#fff" stroke-width="3"/><path d="M69 77l16-30 6 3-16 30-7 6z" fill="#2563eb"/>',
      task: '<rect x="39" y="32" width="40" height="55" rx="5" fill="#fb923c"/><path d="M47 44h23M47 54h23M47 64h16M47 74h16" stroke="#fed7aa" stroke-width="3"/>',
      planner: '<rect x="36" y="39" width="50" height="44" rx="6" fill="#fff" stroke="#14b8a6" stroke-width="2"/><path d="M36 51h50" stroke="#14b8a6" stroke-width="7"/><path d="M47 34v10M74 34v10" stroke="#1d4ed8" stroke-width="4"/><path d="M46 62h7M61 62h7M46 73h7" stroke="#99dcd5" stroke-width="4"/>',
      survey: '<circle cx="61" cy="61" r="23" fill="#cffafe"/><circle cx="61" cy="61" r="15" stroke="#22d3ee" stroke-width="2"/><path d="M61 34v54M34 61h54" stroke="#38bdf8" stroke-width="2"/><circle cx="61" cy="61" r="5" fill="#1d4ed8"/>',
      'site-capture': '<path d="M37 47h11l5-9h17l5 9h11v34H37z" fill="#38bdf8"/><circle cx="61" cy="64" r="13" fill="#fff"/><circle cx="61" cy="64" r="8" fill="#2563eb"/><circle cx="79" cy="53" r="2" fill="#fff"/>',
      submission: '<rect x="35" y="45" width="51" height="35" rx="5" fill="#99dcd5"/><path d="M36 49l25 18 24-18" stroke="#fff" stroke-width="2"/><path d="M61 57V31m-8 8 8-8 8 8" stroke="#fb923c" stroke-width="4"/>',
      bimbox: '<path d="M61 33l26 14-26 14-26-14z" fill="#2563eb"/><path d="M35 60l26 14 26-14" stroke="#38bdf8" stroke-width="8"/><path d="M35 75l26 14 26-14" stroke="#99dcd5" stroke-width="8"/>',
      files: '<path d="M35 42h21l7 8h25v35H35z" fill="#f59e0b"/><rect x="43" y="37" width="32" height="35" rx="4" fill="#fff"/><path d="M35 57h53l-5 29H39z" fill="#fcd34d"/><path d="M49 45h19M49 51h13" stroke="#cbdfee" stroke-width="2"/>',
      search: '<circle cx="57" cy="56" r="19" fill="#cffafe" stroke="#38bdf8" stroke-width="3"/><path d="M71 71l15 15" stroke="#2563eb" stroke-width="8"/><path d="M47 54a10 10 0 0 1 10-9" stroke="#fff" stroke-width="3"/>'
    };

    function confettiPopSvg(key) {
      const id = 'pop-' + key;
      const badgeColor = key === 'issue' ? '#f43f5e' : key === 'submission' ? '#10b981' : '#2563eb';
      const badge = key === 'task' || key === 'submission'
        ? '<path d="M82 83l4 4 8-10" stroke="#fff" stroke-width="3" fill="none"/>'
        : key === 'issue'
          ? '<path d="M87 76v9" stroke="#fff" stroke-width="3"/><circle cx="87" cy="90" r="1.5" fill="#fff"/>'
          : '<path d="M83 79l8 8m0-8-8 8" stroke="#fff" stroke-width="2.5"/>';
      return `<svg viewBox="0 0 128 128" class="w-24 h-24" fill="none">
        <defs><filter id="${id}-shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="1" dy="6" stdDeviation="5" flood-color="#456580" flood-opacity=".18"/></filter></defs>
        <circle cx="64" cy="64" r="43" fill="#eff7fc"/>
        <rect x="35" y="23" width="62" height="67" rx="13" fill="#dceefa"/>
        <g stroke-linecap="round" stroke-linejoin="round" filter="url(#${id}-shadow)">
          <rect x="29" y="28" width="65" height="68" rx="12" fill="#fff" stroke="#60a5fa" stroke-width="1.4"/>
          ${POP_BODIES[key]}
        </g>
        <g stroke-linecap="round" filter="url(#${id}-shadow)"><circle cx="87" cy="83" r="13" fill="${badgeColor}"/>${badge}</g>
        <circle cx="26" cy="29" r="3.7" fill="#10b981"/>
        <circle cx="106" cy="43" r="3.3" fill="#fb923c"/>
        <circle cx="55" cy="106" r="2.4" fill="#38bdf8"/>
        <circle cx="25" cy="89" r="1.8" fill="#a7f3d0"/>
        <circle cx="91" cy="20" r="1.4" fill="#99dcd5"/>
      </svg>`;
    }
    const POP_SECTIONS = Object.fromEntries(Object.entries(SECTIONS).map(([key, item]) => [key, {
      title: item.title, subtitle: item.subtitle, svg: confettiPopSvg(key)
    }]));

    const ICON_SETS = { blue: SECTIONS, clay: CLAY_SECTIONS, line: LINE_SECTIONS, clay3d: CLAY3D_SECTIONS, claycolor: CLAY_COLOR_SECTIONS, neue: NEUE_SECTIONS, linepro: LINEPRO_SECTIONS, allblue: ALLBLUE_SECTIONS, linecolor: LINECOLOR_SECTIONS, pop: POP_SECTIONS };
    let activeIconSet = 'blue';
    let activeSection = 'drawing';

    const SECTION_LABELS = {
      drawing: 'Drawings', model: '3D Models', structure: 'Project Structure',
      shared: 'Shared Files', issue: 'Issues', rfi: 'RFI', 'field-note': 'Field Notes',
      task: 'Tasks', planner: 'Planner', survey: 'Survey Data', 'site-capture': 'Site Capture',
      submission: 'Submissions', bimbox: 'BIMBOX Data', files: 'Custom Folder', search: 'Search'
    };

    function renderTabs() {
      document.getElementById('tabs').innerHTML = Object.entries(ICON_SETS[activeIconSet]).map(([key, item]) => {
        const label = SECTION_LABELS[key];
        return `<button onclick="selectSection('${key}')" id="tab-${key}" type="button" role="tab"
          aria-label="${label}" title="${label}" aria-selected="false"
          class="tab-btn shrink-0 w-12 h-12 rounded-lg flex items-center justify-center bg-white text-slate-600 hover:bg-blue-50 transition">
          ${item.svg}
        </button>`;
      }).join('');
    }

    function selectIconSet(set) {
      activeIconSet = set;
      document.body.classList.toggle('pop-set', set === 'pop');
      document.getElementById('set-pop').classList.toggle('active', set === 'pop');
      document.body.classList.toggle('clay-set', set === 'clay');
      document.body.classList.toggle('line-set', set === 'line');
      document.body.classList.toggle('clay3d-set', set === 'clay3d' || set === 'claycolor');
      document.body.classList.toggle('clay-blue-shade', set === 'clay3d');
      document.getElementById('set-claycolor').classList.toggle('active', set === 'claycolor');
      document.body.classList.toggle('neue-set', set === 'neue');
      document.body.classList.toggle('linepro-set', set === 'linepro');
      document.body.classList.toggle('allblue-set', set === 'allblue');
      document.body.classList.toggle('linecolor-set', set === 'linecolor');
      document.getElementById('set-blue').className = `set-tab rounded-md px-3 py-2 text-xs font-semibold ${set === 'blue' ? 'active' : 'text-slate-500'}`;
      document.getElementById('set-clay').className = `set-tab rounded-md px-3 py-2 text-xs font-semibold ${set === 'clay' ? 'active' : 'text-slate-500'}`;
      document.getElementById('set-line').className = `set-tab rounded-md px-3 py-2 text-xs font-semibold ${set === 'line' ? 'active' : 'text-slate-500'}`;
      document.getElementById('set-clay3d').className = `set-tab rounded-md px-3 py-2 text-xs font-semibold ${set === 'clay3d' ? 'active' : 'text-slate-500'}`;
      document.getElementById('set-neue').className = `set-tab rounded-md px-3 py-2 text-xs font-semibold ${set === 'neue' ? 'active' : 'text-slate-500'}`;
      document.getElementById('set-linepro').className = `set-tab rounded-md px-3 py-2 text-xs font-semibold ${set === 'linepro' ? 'active' : 'text-slate-500'}`;
      document.getElementById('set-allblue').className = `set-tab rounded-md px-3 py-2 text-xs font-semibold ${set === 'allblue' ? 'active' : 'text-slate-500'}`;
      document.getElementById('set-linecolor').className = `set-tab rounded-md px-3 py-2 text-xs font-semibold ${set === 'linecolor' ? 'active' : 'text-slate-500'}`;
      renderTabs();
      selectSection(activeSection);
    }

    function selectSection(key) {
      const data = ICON_SETS[activeIconSet][key];
      if (!data) return;
      activeSection = key;

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = "tab-btn shrink-0 w-12 h-12 rounded-lg flex items-center justify-center bg-white text-slate-600 hover:bg-blue-50 transition";
        btn.setAttribute('aria-selected', 'false');
      });
      const activeBtn = document.getElementById(`tab-${key}`);
      if (activeBtn) {
        activeBtn.className = "tab-btn shrink-0 w-12 h-12 rounded-lg flex items-center justify-center bg-blue-50 text-blue-700 transition";
        activeBtn.setAttribute('aria-selected', 'true');
      }

      const container = document.getElementById('preview-container');
      container.innerHTML = `
        <div class="relative mb-4 flex items-center justify-center">
          <div class="absolute -inset-4 rounded-full bg-blue-100/60 blur-xl"></div>
          ${data.svg}
        </div>
        <h3 class="text-base font-bold text-slate-800 tracking-tight">${data.title}</h3>
        <p class="text-[13px] text-slate-500 mt-1 max-w-sm">${data.subtitle}</p>
        <div class="mt-5 flex gap-2">
          ${key === 'search' 
            ? `<button class="px-3.5 py-1.5 text-xs font-medium bg-white border border-slate-200 text-slate-700 rounded-lg hover:bg-slate-50">Clear search</button>`
            : `<button class="px-3.5 py-1.5 text-xs font-semibold bg-blue-600 text-white rounded-lg hover:bg-blue-700 shadow-xs">Upload files</button>
               <button class="px-3.5 py-1.5 text-xs font-medium bg-white border border-slate-200 text-slate-700 rounded-lg hover:bg-slate-50">New folder</button>`
          }
        </div>
      `;
    }

    selectIconSet('blue');
  </script>
</body>
