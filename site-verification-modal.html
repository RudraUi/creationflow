<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Site Verification Type</title>
<style>
  @font-face{
    font-family:"Mona Sans";
    src:url("https://cdn.jsdelivr.net/npm/@fontsource-variable/mona-sans/files/mona-sans-latin-wght-normal.woff2") format("woff2");
    font-weight:200 900;
    font-style:normal;
    font-display:swap;
  }

  :root{
    --bg:#ffffff;
    --ink:#10182b;
    --muted:#64748b;
    --line:#dbe5f2;
    --soft-blue:#eef5ff;
    --blue:#2468f2;
    --shadow:0 24px 60px rgba(16,24,43,.28);
    --radius:18px;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Mona Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color:var(--ink);
  }

  button{font:inherit;cursor:pointer}
  svg{display:block}

  /* Fake satellite/site backdrop so the trigger button has somewhere to live */
  .workspace-backdrop{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:flex-end;
    padding:28px;
    background:
      radial-gradient(circle at 20% 30%, rgba(120,140,90,.55), transparent 40%),
      radial-gradient(circle at 75% 20%, rgba(90,80,60,.5), transparent 45%),
      radial-gradient(circle at 60% 80%, rgba(70,90,60,.5), transparent 40%),
      repeating-linear-gradient(45deg, rgba(40,35,25,.15) 0 2px, transparent 2px 6px),
      linear-gradient(160deg, #3c3a30, #26241d 60%, #1c1b16);
  }

  .open-survey-btn{
    border:0;
    background:#fff;
    color:var(--blue);
    width:52px;
    height:52px;
    border-radius:50%;
    display:grid;
    place-items:center;
    box-shadow:var(--shadow);
  }
  .open-survey-btn svg{width:24px;height:24px}
  .open-survey-btn:hover{background:var(--soft-blue)}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(15,20,35,.45);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    opacity:0;
    visibility:hidden;
    transition:opacity .2s ease;
  }
  .modal-backdrop.open{
    opacity:1;
    visibility:visible;
  }

  .modal-card{
    width:100%;
    max-width:560px;
    background:var(--bg);
    border-radius:24px;
    box-shadow:var(--shadow);
    padding:28px 30px 26px;
    transform:translateY(14px) scale(.97);
    opacity:0;
    transition:transform .25s ease, opacity .25s ease;
  }
  .modal-backdrop.open .modal-card{
    transform:translateY(0) scale(1);
    opacity:1;
  }

  .modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .modal-head-left{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .modal-back{
    border:0;
    background:transparent;
    color:var(--muted);
    padding:4px;
    border-radius:8px;
    display:grid;
    place-items:center;
  }
  .modal-back:hover{background:var(--soft-blue);color:var(--blue)}
  .modal-back svg{width:19px;height:19px}

  .modal-head h2{
    margin:0;
    font-size:19px;
    font-weight:700;
  }

  .modal-badge{
    background:var(--soft-blue);
    color:var(--blue);
    font-size:10px;
    font-weight:700;
    letter-spacing:.06em;
    padding:6px 12px;
    border-radius:999px;
  }

  hr.modal-divider{
    border:none;
    border-top:1px solid var(--line);
    margin:16px 0 26px;
  }

  /* Select-project-type style grid: icon circle on top, label below */
  .type-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:26px 18px;
    justify-items:center;
    padding:4px 6px 10px;
  }

  .type-card{
    border:0;
    background:transparent;
    color:var(--ink);
    text-align:center;
    padding:0;
    width:100%;
  }

  .icon-circle{
    width:58px;height:58px;border-radius:50%;
    background:var(--soft-blue);
    color:var(--blue);
    display:grid;
    place-items:center;
    margin:0 auto 10px;
    border:1px solid transparent;
    transition:.2s ease;
  }
  .icon-circle svg{width:22px;height:22px;stroke-width:1.9}
  .icon-circle svg.icon-lg{width:30px;height:30px}

  .type-card span{
    font-size:13px;
    color:#37475f;
  }

  .type-card:hover .icon-circle{
    transform:translateY(-2px);
    border-color:#c7daf7;
    background:#e8f1ff;
  }

  .type-card.selected .icon-circle{
    background:var(--blue);
    color:#fff;
    box-shadow:0 10px 24px rgba(36,104,242,.25);
  }
  .type-card.selected span{
    color:var(--blue);
    font-weight:700;
  }

  .modal-footer{
    display:flex;
    justify-content:flex-end;
    margin-top:8px;
  }

  .continue-btn{
    border:0;
    background:var(--blue);
    color:#fff;
    font-weight:700;
    font-size:14px;
    padding:12px 22px;
    border-radius:999px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    box-shadow:0 12px 28px rgba(36,104,242,.28);
  }
  .continue-btn svg{width:16px;height:16px}
  .continue-btn:hover{background:#1557df}

  @media (max-width:480px){
    .type-grid{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>

  <div class="workspace-backdrop">
    <button class="open-survey-btn" id="openSurveyBtn" title="Site Survey">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
    </button>
  </div>

  <div class="modal-backdrop" id="surveyModal">
    <div class="modal-card">
      <div class="modal-head">
        <div class="modal-head-left">
          <button class="modal-back" id="surveyClose" title="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          </button>
          <h2>Choose site verification type</h2>
        </div>
        <span class="modal-badge">SITE SURVEY</span>
      </div>
      <hr class="modal-divider" />

      <div class="type-grid">
        <button class="type-card selected" data-type="Walkthrough">
          <div class="icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </div>
          <span>Walkthrough</span>
        </button>

        <button class="type-card" data-type="Laser Scan">
          <div class="icon-circle">
            <svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.2v6.8M8.2 22l3.8-6 3.8 6"/><circle cx="12" cy="12" r="2.3"/><path d="M12 9.7V3" stroke-dasharray="1.8 2.2"/><path d="M10.3 10.3 5.5 5.5" stroke-dasharray="1.8 2.2"/><path d="M13.7 10.3 18.5 5.5" stroke-dasharray="1.8 2.2"/></svg>
          </div>
          <span>Laser Scan</span>
        </button>

        <button class="type-card" data-type="Photo / Video">
          <div class="icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg>
          </div>
          <span>Photo / Video</span>
        </button>

        <button class="type-card" data-type="Drone">
          <div class="icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
          </div>
          <span>Drone</span>
        </button>

        <button class="type-card" data-type="Land Survey">
          <div class="icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
          </div>
          <span>Land survey</span>
        </button>
      </div>

      <div class="modal-footer">
        <button class="continue-btn" id="surveyContinue">
          Continue
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </div>

<script>
  const modal = document.getElementById("surveyModal");
  const openBtn = document.getElementById("openSurveyBtn");
  const closeBtn = document.getElementById("surveyClose");
  const continueBtn = document.getElementById("surveyContinue");
  const cards = document.querySelectorAll(".type-card");

  function openModal(){ modal.classList.add("open"); }
  function closeModal(){ modal.classList.remove("open"); }

  openBtn.addEventListener("click", openModal);
  closeBtn.addEventListener("click", closeModal);
  modal.addEventListener("click", (e) => { if(e.target === modal) closeModal(); });

  cards.forEach(card => {
    card.addEventListener("click", () => {
      cards.forEach(c => c.classList.remove("selected"));
      card.classList.add("selected");
    });
  });

  continueBtn.addEventListener("click", () => {
    const selected = document.querySelector(".type-card.selected");
    console.log("Site verification type:", selected ? selected.dataset.type : null);
    closeModal();
  });
</script>
</body>
</html>
